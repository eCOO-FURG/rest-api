name: run deploy

on:
  push:
    branches:
      - main

jobs:
  run-deploy:
    name: Deploy workflow
    runs-on: ecoo-homologacao
    steps:
      - name: Deploy application
        run: |
          sudo su

          cd /deploy/rest-api

          docker-compose stop

          docker rm -f ecoo-server || true

          git pull

          pnpm run deploy:build

          npx prisma migrate deploy
