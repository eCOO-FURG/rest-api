name: run production deploy

on:
  push:
    branches:
      - main

jobs:
  run-deploy:
    name: Production deploy workflow
    runs-on: ecoo-producao
    steps:
      - name: Deploy application to production
        run: |
          cd /deploy/rest-api

          sudo -i docker-compose stop

          sudo -i docker rm ecoo-server || true

          sudo -i git pull

          sudo -i pnpm run deploy:build

          sudo -i npx prisma migrate deploy
