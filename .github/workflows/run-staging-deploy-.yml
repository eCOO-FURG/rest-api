name: run staging deploy

on:
  push:
    branches:
      - staging

jobs:
  run-deploy-staging:
    name: Staging deploy workflow
    runs-on: ecoo-homologacao
    steps:
      - name: Deploy application to staging
        run: |
          sudo su - << 'EOF'

          cd /deploy/rest-api

          sudo docker-compose stop

          sudo docker rm ecoo-server-homolog || true

          sudo git pull

          sudo pnpm run deploy:build

          sudo npx prisma migrate deploy

          EOF
